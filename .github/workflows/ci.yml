name: CI

on:
  push:
    branches: [ "product/v1-foundation", "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test_results.trx" --results-directory ./TestResults

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-test-results
        path: ./TestResults/**/*.trx

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/PSL.ProjectHub.Web

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'src/PSL.ProjectHub.Web/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint 2>/dev/null || echo "Lint skipped (no script defined)"

    - name: Type Check
      run: npx tsc --noEmit

    - name: Build
      run: npm run build

    - name: Audit (production deps only)
      run: npm audit --audit-level=critical --omit=dev

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
    - uses: actions/checkout@v4

    - name: Check for hardcoded secrets (basic)
      run: |
        if grep -rn "Viewer123\|Admin123\|password.*=.*\"[A-Za-z0-9]*!\"" src/ --include="*.cs" --include="*.ts" --include="*.tsx" --include="*.json"; then
          echo "::error::Hardcoded credentials detected in source files!"
          exit 1
        fi
        echo "No hardcoded credentials found."